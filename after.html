.deep{display:grid;gap:20px;margin:36px 0 0}
.deep-item{background:white;border:1px solid var(--line);padding:22px 26px}
.deep-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.deep-head h3{font-size:21px;letter-spacing:-.7px;margin:0}
.deep-head span{font-size:14px;color:var(--muted)}
.deep-row{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center}
.chain-figure{margin:0;padding:14px 16px;background:var(--paper);border:1px solid var(--line)}
.chain-figure svg{width:100%;height:auto;display:block}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.parts li{font-size:14.5px;color:var(--muted);line-height:1.5}
.parts b{display:inline-block;min-width:60px;color:var(--text);font-weight:800}
.deep-line{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted);line-height:1.6}
.app-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.app-col{padding:15px 17px;border:1px solid var(--line);border-top-width:3px;background:var(--paper)}
.app-col b{display:block;font-size:14px;font-weight:850;margin-bottom:7px}
.app-col span{font-size:14px;color:var(--muted);line-height:1.55}
.app-col.ok{border-top-color:#9aa3a2}.app-col.ok b{color:#3f6a52}
.app-col.mid{border-top-color:var(--gold)}.app-col.mid b{color:var(--gold)}
.app-col.no{border-top-color:#b6bcbb}.app-col.no b{color:var(--muted)}
.market-block{margin:40px 0 0;background:white;border:1px solid var(--line);padding:30px 32px}
.market-block>h3{font-size:24px;letter-spacing:-.9px;margin:0 0 6px}
.market-block>.market-sub{font-size:15px;color:var(--muted);margin:0 0 22px}
.market{width:100%;border-collapse:collapse;font-size:16px}
.market th{text-align:left;font-size:12.5px;font-weight:800;color:var(--muted);padding:12px 16px;background:#f0f0ea;border-bottom:1px solid var(--line);white-space:nowrap}
.market td{padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}
.market tbody tr:last-child td{border-bottom:0}
.market td:first-child{color:var(--text);font-weight:750}
.market .num{font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--text)}
.market tr.key td{background:#fbf0f2}
.market tr.key td:first-child{color:var(--red);font-weight:850}
.market-link{margin:18px 0 0;padding:15px 18px;background:var(--paper);border-left:3px solid var(--red);font-size:15px;color:var(--muted);line-height:1.6}
.market-link b{color:var(--red);font-weight:850}
.market-notes{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:7px}
.market-notes li{font-size:13px;color:var(--muted);line-height:1.6;padding-left:17px;position:relative}
.market-notes li:before{content:'\203B';position:absolute;left:0}
.offices-head{font-size:18px;letter-spacing:-.5px;margin:32px 0 16px}
.flag{display:inline-block;margin:0 0 12px;padding:6px 12px;background:var(--gold);color:white;font-size:13px;font-weight:800;letter-spacing:-.2px}
.roadmap{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(5,1fr)}
.roadmap li{position:relative;background:white;border:1px solid var(--line);border-left:0;border-top:3px solid #c8cecd;padding:24px 22px 22px;display:flex;flex-direction:column}
.roadmap li:first-child{border-left:1px solid var(--line)}
.roadmap li.now{border-top-color:var(--red);background:#fdfafa}
.roadmap .rn{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.roadmap h3{font-size:20px;letter-spacing:-.7px;margin:10px 0 9px}
.roadmap p{font-size:15px;color:var(--muted);margin:0;line-height:1.55}
.roadmap .via{display:block;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;font-weight:750;color:var(--text)}
.roadmap .tag{align-self:flex-start;margin-top:16px;font-size:12px;font-weight:800;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.roadmap li.now .tag{border-color:var(--red);color:var(--red)}
@media (max-width:1100px){
  .roadmap{grid-template-columns:1fr 1fr}
  .roadmap li{border-left:1px solid var(--line)}
  .deep-item,.market-block{padding:22px 20px}
}
@media (max-width:720px){
  .roadmap{grid-template-columns:1fr}
  .market,.dtable{font-size:14px}
  .market th,.market td,.dtable th,.dtable td{padding:11px 12px}
}
@media print{
  .deep{gap:16px;margin-top:20px}
  .deep-item,.market-block{padding:14px 16px;break-inside:avoid}
  .deep-item>h3,.market-block>h3{font-size:14pt}
  .market{font-size:9.5pt}
  .market th,.market td{padding:7px 9px}
  .deep-row{grid-template-columns:1fr 1fr;gap:14px}
  .parts li,.app-col span,.deep-line{font-size:8.5pt}
  .market .num{font-size:11pt}

function hubContent(){return `<header class="hero"><p class="eyebrow">DRB · CHAIN TO BELT · 2026.09</p><h1>체인 대체 벨트 — 진행 경과와 사업화 검토</h1></header><ol class="tl2" aria-label="진행 경과"><li><b>2025.10</b><span>킥오프</span></li><li><b>2026.02</b><span>미래성장토론</span></li><li><b>2026.04</b><span>특약점 방문</span></li><li><b>2026.05</b><span>BIZ DAY</span></li><li><b>2026.07–09</b><span>고객 VOC 설문</span></li><li class="now"><b>현재</b><span>실차 검증 · 사업화 검토</span></li></ol><div class="gates"><a class="gate" href="before.html" aria-label="1부, 시장 검토와 타겟 선정 보기"><p class="eyebrow">1부 · STEP 01–06</p><h2>시장 검토 및 타겟 선정</h2><p class="gate-sub">체인 시장 · 구조 · 경쟁사 · 어플리케이션 분석을 거쳐 첫 타겟 지게차 승강부 선정, 추진 로드맵까지</p><span class="go">지나온 과정 요약 →</span></a><a class="gate main-gate" href="after.html" aria-label="2부, 고객 예비조사 결과와 추후 계획 보기"><p class="eyebrow">2부 · STEP 06 · 07</p><h2>고객 예비조사 및 추후 계획</h2><p class="gate-sub">고객사 ${SURVEYS_TOTAL}곳 예비조사에서 확인한 접점과 자체 평가의 공백, 이를 채울 단기 · 장기 과제</p><span class="go">조사 결과 · 추후 계획 →</span></a></div>`}
const page='after';$('content').innerHTML=afterContent();

const tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl);
const tipMove=e=>{const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let x=e.clientX+14,y=e.clientY-h-10;if(x+w>innerWidth-8)x=innerWidth-w-8;if(y<8)y=e.clientY+18;tipEl.style.left=x+'px';tipEl.style.top=y+'px'};

document.addEventListener('click',e=>{const c=e.target&&e.target.closest?e.target.closest('.app-col[data-group]'):null;if(!c)return;const wrap=c.closest('.deep-item'),open=!c.classList.contains('open');wrap.querySelectorAll('.app-col[data-group]').forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false')});wrap.querySelectorAll('.app-detail').forEach(d=>d.hidden=true);if(open){c.classList.add('open');c.setAttribute('aria-expanded','true');const d=wrap.querySelector(`.app-detail[data-for="${c.dataset.group}"]`);if(d)d.hidden=false}});

const storageKey='c2b-scroll-'+page;

function updateCurrent(){if(!sections.length)return;let index=0;if(page==='before'){index=current}else{sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.45)index=i})}current=index;sections.forEach((s,i)=>{if(page==='before')s.classList.toggle('active',i===current)});document.querySelectorAll('.section-nav a').forEach((a,i)=>a.setAttribute('aria-current',String(i===current)));$('state').textContent=page==='before'?`STEP ${String(current+1).padStart(2,'0')} · ${STAGES[current].ko}`:`${current+1} / ${sections.length} · ${sections[current].dataset.title}`;if($('prev')){$('prev').disabled=current===0;$('next').disabled=current===sections.length-1}}
function go(index){if(index<0||index>=sections.length)return;current=index;const s=sections[index];s.scrollIntoView({block:'start',behavior:'instant'});s.focus({preventScroll:true});if(page==='before')setMore(s,true);updateCurrent()}

addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,button,summary,[contenteditable=true]'))return;if(page==='index'){if(['1','ArrowLeft'].includes(e.key)){e.preventDefault();location.href='before.html'}if(['2','ArrowRight'].includes(e.key)){e.preventDefault();location.href='after.html'}return}if(/^\d$/.test(e.key)&&Number(e.key)>0&&Number(e.key)<=sections.length){e.preventDefault();go(Number(e.key)-1)}else if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});
